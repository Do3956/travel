name: Deploy Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # wrangler-action@v3 often only shows "npx failed with exit code 1"
      # and hides the real wrangler stderr (see cloudflare/wrangler-action#360).
      # Use a direct wrangler invoke so auth / permission errors are readable.
      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Add it under Settings → Secrets and variables → Actions (Repository secrets, not Environment secrets)."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is empty. Expected a3310520f43804d618fbca58898b2b1d for this project."
            exit 1
          fi
          # Length-only diagnostics (never print secret values)
          echo "CLOUDFLARE_API_TOKEN length: ${#CLOUDFLARE_API_TOKEN}"
          echo "CLOUDFLARE_ACCOUNT_ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
          echo "CLOUDFLARE_ACCOUNT_ID value: ${CLOUDFLARE_ACCOUNT_ID}"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Token must include Account → Cloudflare Pages → Edit.
          # "Edit Cloudflare Workers" template does NOT include Pages Edit
          # (see Cloudflare API token templates docs).
        run: |
          set -euo pipefail
          echo "== wrangler whoami =="
          npx --yes wrangler@4 whoami 2>&1 || true
          echo "== pages deploy =="
          # Git branch is master; CF production branch is main
          npx --yes wrangler@4 pages deploy . \
            --project-name=travel \
            --branch=main \
            --commit-dirty=true \
            2>&1
