<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="旅游路书目录：按行程浏览可抄作业的自驾攻略" />
  <title>旅游路书</title>
  <style>
    :root {
      --ink: #1a2421;
      --muted: #5c6b66;
      --paper: #f7f4ef;
      --accent: #c45c26;
      --line: rgba(26, 36, 33, 0.1);
      --nav: #00754a;
      --radius: 6px;
      --font-display: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
      --font-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(ellipse 120% 80% at 10% -20%, rgba(196, 92, 38, 0.15), transparent 50%),
        radial-gradient(ellipse 80% 60% at 100% 0%, rgba(0, 117, 74, 0.08), transparent 45%),
        linear-gradient(180deg, #ebe6dc 0%, var(--paper) 35%, var(--paper) 100%);
      min-height: 100vh;
      line-height: 1.65;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: clamp(2.5rem, 8vw, 4rem) 1.25rem 3rem;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 2.6rem);
      font-weight: 700;
      line-height: 1.15;
      margin: 0 0 0.5rem;
    }

    .lead {
      color: var(--muted);
      margin: 0 0 2rem;
      font-size: 1.05rem;
    }

    .guides {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .guides a {
      display: block;
      padding: 1.15rem 1.25rem;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, background 0.15s;
    }

    .guides a:hover {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.9);
    }

    .guides .date {
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .guides .title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      color: var(--nav);
      margin: 0 0 0.4rem;
    }

    .guides a:hover .title {
      text-decoration: underline;
    }

    .guides .blurb {
      margin: 0;
      font-size: 0.95rem;
      color: var(--muted);
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>旅游路书</h1>
    <p class="lead">亲测行程合集。点进某一趟查看完整路书与导航。</p>

    <ul class="guides">
      <li>
        <a href="guides/2026-guangxi-national-day/">
          <div class="date">2026.10.3 – 10.7</div>
          <div class="title">国庆广西路书</div>
          <p class="blurb">5 天自驾：东莞篮球打卡 → 柳州吃玩 → 马山星空洞 → 戈见山徒步。</p>
        </a>
      </li>
    </ul>

    <footer>新增行程见 README · 每趟独立目录</footer>
  </div>
</body>

</html>
